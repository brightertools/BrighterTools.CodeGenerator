name: publish-tool

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional package version override (for example 2.0.3)
        required: false
        type: string
      publish_to_nuget:
        description: Actually publish the generated package to nuget.org (must be true to push)
        required: true
        default: false
        type: boolean

jobs:
  pack-and-publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ./BrighterTools.CodeGenerator.csproj --configfile ./NuGet.config

      - name: Build
        run: dotnet build ./BrighterTools.CodeGenerator.csproj --configuration Release --no-restore

      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            dotnet pack ./BrighterTools.CodeGenerator.csproj --configuration Release --no-build --output ./artifacts/nuget --configfile ./NuGet.config /p:Version=${{ inputs.version }}
          else
            dotnet pack ./BrighterTools.CodeGenerator.csproj --configuration Release --no-build --output ./artifacts/nuget --configfile ./NuGet.config
          fi

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: brightertools-codegenerator-nuget
          path: ./artifacts/nuget/*
          if-no-files-found: error

      - name: NuGet login (OIDC to temp API key)
        if: ${{ inputs.publish_to_nuget }}
        uses: NuGet/login@v1
        id: login
        with:
          user: brightertools

      - name: Publish to NuGet with Trusted Publishing
        if: ${{ inputs.publish_to_nuget }}
        run: dotnet nuget push ./artifacts/nuget/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
