name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ./BrighterTools.CodeGenerator.slnx --configfile ./NuGet.config

      - name: Build
        run: dotnet build ./BrighterTools.CodeGenerator.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ./BrighterTools.CodeGenerator.slnx --configuration Release --no-build --verbosity normal

      - name: Pack tool
        run: dotnet pack ./BrighterTools.CodeGenerator.csproj --configuration Release --no-build --output ./artifacts/nuget --configfile ./NuGet.config

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: brightertools-codegenerator-nuget
          path: ./artifacts/nuget/*
          if-no-files-found: error
